<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaMondiale 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
    <!-- Tailwind CSS per una UI responsive, moderna e pulita -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @keyframes ticker {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        #ticker-track {
            display: inline-flex;
            align-items: center;
            gap: 0;
            white-space: nowrap;
            animation: ticker 60s linear infinite;
        }
        #ticker-track:hover { animation-play-state: paused; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-12">

    <!-- Header statico con Navbar ottimizzata per Mobile -->
    <header class="bg-blue-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">🏆 FantaMondiale 2026</h1>
            <span class="bg-blue-700 text-xs px-3 py-1 rounded-full font-semibold">12 Giocatori</span>
        </div>
        <div id="news-ticker" class="bg-blue-950 border-t border-blue-800 overflow-hidden py-1.5 hidden">
            <div id="ticker-track" class="text-xs text-blue-200"></div>
        </div>
        <!-- Navbar a tre Tab -->
        <nav class="bg-blue-950 text-sm border-t border-blue-800">
            <div class="max-w-4xl mx-auto flex justify-around">
                <button onclick="switchTab('tab-classifica')" id="btn-tab-classifica" class="flex-1 py-3 text-center font-medium border-b-2 border-blue-400 text-white text-sm">Classifica</button>
                <button onclick="switchTab('tab-partite')" id="btn-tab-partite" class="flex-1 py-3 text-center font-medium border-b-2 border-transparent text-gray-400 text-sm">Partite</button>
                <button onclick="switchTab('tab-statistiche')" id="btn-tab-statistiche" class="flex-1 py-3 text-center font-medium border-b-2 border-transparent text-gray-400 text-sm">Statistiche</button>
                <button onclick="switchTab('tab-squadre')" id="btn-tab-squadre" class="flex-1 py-3 text-center font-medium border-b-2 border-transparent text-gray-400 text-sm">Squadre</button>
            </div>
        </nav>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- SEZIONE 1: CLASSIFICA GENERALE DEI GIOCATORI -->
        <section id="tab-classifica" class="tab-content active">
            <div class="bg-white rounded-xl shadow-xs p-4 mb-4 border border-gray-100">
                <h2 class="text-lg font-bold mb-3 text-gray-900">Classifica Generale</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-gray-200 text-xs text-gray-500 uppercase">
                                <th class="py-2 w-12 text-center">#</th>
                                <th class="py-2">Giocatore</th>
                                <th class="py-2">Top (1ª)</th>
                                <th class="py-2">Out. (2ª)</th>
                                <th class="py-2 text-right">Punti</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-classifica" class="text-sm divide-y divide-gray-100">
                            <!-- Popolato dinamicamente da JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- SEZIONE 2: LISTA PARTITE E TABELLINI -->
        <section id="tab-partite" class="tab-content">
            <div class="bg-white rounded-xl shadow-xs p-4 border border-gray-100">
                <h2 class="text-lg font-bold mb-3 text-gray-900">Risultati Match</h2>
                <div id="lista-partite" class="space-y-3">
                    <!-- Popolato dinamicamente da JS -->
                </div>
            </div>
        </section>

        <!-- SEZIONE 3: LISTA SQUADRE E MOLTIPLICATORI -->
        <section id="tab-squadre" class="tab-content">
            <div class="bg-white rounded-xl shadow-xs p-4 border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-gray-900">Nazionali e Moltiplicatori</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="griglia-squadre">
                    <!-- Popolato dinamicamente da JS -->
                </div>
            </div>
        </section>

        <!-- SEZIONE 4: GRAFICO STATISTICHE SQUADRE -->
        <section id="tab-statistiche" class="tab-content">
            <div class="bg-white rounded-xl shadow-xs p-4 border border-gray-100">
                <h2 class="text-lg font-bold mb-1 text-gray-900">Punti per Nazione</h2>
                <p class="text-xs text-gray-400 mb-3">Punti pesati con i moltiplicatori di vittoria e pareggio</p>
                <div class="flex gap-4 text-xs text-gray-500 mb-4">
                    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-sm bg-blue-500"></span>Fascia 1</span>
                    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded-sm bg-emerald-500"></span>Fascia 2</span>
                </div>
                <div id="grafico-squadre" class="space-y-1.5">
                    <!-- Popolato dinamicamente da JS -->
                </div>
            </div>
        </section>

    </main>

    <script>
        // SE SEI SU GITHUB PAGES: Lascia 'risultati.json' se il file si trova nello stesso percorso.

        const databaseSquadre = {

            // ===== FASCIA 2 =====
            "AUT": { nome: "Austria",            fascia: 2, ranking: 21, mult_v: 3.52, mult_p: 1.17 },
            "ECU": { nome: "Ecuador",            fascia: 2, ranking: 22, mult_v: 3.52, mult_p: 1.17 },
            "TUR": { nome: "Turchia",            fascia: 2, ranking: 23, mult_v: 3.56, mult_p: 1.19 },
            "AUS": { nome: "Australia",          fascia: 2, ranking: 24, mult_v: 3.58, mult_p: 1.19 },
            "NOR": { nome: "Norvegia",           fascia: 2, ranking: 25, mult_v: 3.61, mult_p: 1.20 },
            "CAN": { nome: "Canada",             fascia: 2, ranking: 26, mult_v: 3.68, mult_p: 1.23 },

            "TUN": { nome: "Tunisia",            fascia: 2, ranking: 35, mult_v: 4.02, mult_p: 1.34 },

            "PAN": { nome: "Panama",             fascia: 2, ranking: 41, mult_v: 4.33, mult_p: 1.44 },
            "JOR": { nome: "Giordania",          fascia: 2, ranking: 42, mult_v: 4.40, mult_p: 1.47 },
            "GHA": { nome: "Ghana",              fascia: 2, ranking: 43, mult_v: 4.47, mult_p: 1.49 },
            "COD": { nome: "RD Congo",           fascia: 2, ranking: 44, mult_v: 4.50, mult_p: 1.50 },
            "CPV": { nome: "Capo Verde",         fascia: 2, ranking: 45, mult_v: 4.62, mult_p: 1.54 },
            "CUW": { nome: "Curaçao",            fascia: 2, ranking: 46, mult_v: 4.90, mult_p: 1.63 },
            "HTI": { nome: "Haiti",              fascia: 2, ranking: 47, mult_v: 5.12, mult_p: 1.71 },
            "NZL": { nome: "Nuova Zelanda",      fascia: 2, ranking: 48, mult_v: 5.31, mult_p: 1.77 }           
        };

        const listaGiocatori = [
            { nome: "Alessandro", top: "ENG", outsider: "TUR" },
            { nome: "Andrea", top: "GER", outsider: "TUR" },
            { nome: "Davide", top: "ESP", outsider: "TUR" },
            { nome: "Elio", top: "FRA", outsider: "CAN" },
            { nome: "Lorenzo", top: "ENG", outsider: "ALG" },  
            { nome: "Lucio", top: "BRA", outsider: "TUR" },
            { nome: "Marco", top: "NED", outsider: "NOR" },
            { nome: "Massimo", top: "ESP", outsider: "NOR" },
            { nome: "Nicky", top: "POR", outsider: "NOR" },
            { nome: "Paolo", top: "GER", outsider: "NOR" },
            { nome: "Stefano", top: "POR", outsider: "ECU" },
            { nome: "Uranio", top: "NED", outsider: "SWE" }
        ];

        // Switcher dei Tab di navigazione
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('border-blue-400', 'text-white');
                btn.classList.add('border-transparent', 'text-gray-400');
            });
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.remove('border-transparent', 'text-gray-400');
            activeBtn.classList.add('border-blue-400', 'text-white');
        }

        // Core business dell'applicazione: caricamento, calcolo dei moltiplicatori e rendering
        async function caricaEElabora() {
            let risultati = [];
            try {
                const res = await fetch(URL_RISULTATI, { cache: 'no-store' });
                risultati = await res.json();
            } catch (e) {
                console.warn("Nessun file di risultati valido trovato (o errore CORS). Avvio con risultati vuoti.");
            }

            // Inizializza/Resetta a 0 i punti accumulati di tutte le nazionali nel dizionario
            Object.keys(databaseSquadre).forEach(c => databaseSquadre[c].puntiReali = 0);

            // Analizza i gol del JSON per assegnare i punti pesati alle singole squadre
            risultati.forEach(match => {
                if (match.gol_home === null || match.gol_away === null || match.gol_home === undefined || match.gol_away === undefined) return;

                const sqCasa = databaseSquadre[match.home];
                const sqFuori = databaseSquadre[match.away];
                if (!sqCasa || !sqFuori) return;

                // Calcolo matematico dell'esito in base ai gol segnati
                const et = match.extra_time || 0;
                const bonusVinc = et === 1 ? -0.5 : et === 2 ? -1.0 : 0;
                const bonusPerd = et === 2 ? 0.5 : 0;

                if (match.gol_home > match.gol_away) {
                    sqCasa.puntiReali  += sqCasa.mult_v + bonusVinc;
                    if (et > 0) sqFuori.puntiReali += sqFuori.mult_p + bonusPerd;
                } else if (match.gol_home < match.gol_away) {
                    sqFuori.puntiReali += sqFuori.mult_v + bonusVinc;
                    if (et > 0) sqCasa.puntiReali  += sqCasa.mult_p + bonusPerd;
                } else {
                    sqCasa.puntiReali  += sqCasa.mult_p;
                    sqFuori.puntiReali += sqFuori.mult_p;
                }
            });

            // Associa i punti accumulati dalle nazionali alle schede dei 13 amici
            const classificaFinal = listaGiocatori.map(g => {
                const pTop = databaseSquadre[g.top].puntiReali;
                const pOut = databaseSquadre[g.outsider].puntiReali;
                return {
                    nome: g.nome,
                    topCod: g.top,
                    topNome: databaseSquadre[g.top].nome,
                    outCod: g.outsider,
                    outNome: databaseSquadre[g.outsider].nome,
                    totale: parseFloat((pTop + pOut).toFixed(2)) // Previene i bug di virgola mobile di JS
                };
            }).sort((a, b) => b.totale - a.totale); // Ordinamento decrescente (dal 1° all'ultimo)

            // INTERFACCIA 1: COSTRUZIONE TABELLA CLASSIFICA
            const medaglie = ['🥇', '🥈', '🥉'];
            const corpoClassifica = document.getElementById('corpo-classifica');
            const podiumClass = [
                'bg-amber-100/80 font-semibold text-amber-950',   // 1° oro
                'bg-gray-100/90 font-semibold text-gray-800',      // 2° argento
                'bg-orange-100/70 font-semibold text-orange-950',  // 3° bronzo
            ];
            corpoClassifica.innerHTML = classificaFinal.map((g, idx) => `
                <tr class="${idx < 3 ? podiumClass[idx] : 'text-gray-700'}">
                    <td class="py-3 text-center text-gray-400 font-mono">${idx + 1}</td>
                    <td class="py-3 font-medium text-gray-900">${idx < 3 ? medaglie[idx] + ' ' : ''} ${g.nome}</td>
                    <td class="py-3 text-xs text-gray-500">${getFlag(g.topCod)} ${g.topNome}</td>
                    <td class="py-3 text-xs text-gray-500">${getFlag(g.outCod)} ${g.outNome}</td>
                    <td class="py-3 text-right font-bold text-blue-900 text-base">${g.totale.toFixed(2)}</td>
                </tr>
            `).join('');

            // Ordina le partite cronologicamente (dalla più vecchia alla più recente) per il rendering
            const toDateKey = d => d ? d.split('/').reverse().join('') : '';
            risultati.sort((a, b) => toDateKey(a.date).localeCompare(toDateKey(b.date)));

            // INTERFACCIA 2: COSTRUZIONE LISTA PARTITE CON MARCATURA GOL
            const containerPartite = document.getElementById('lista-partite');
            if (risultati.length === 0) {
                containerPartite.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-gray-400 text-sm italic">Nessun match disputato o registrato.</p>
                        <p class="text-gray-400 text-xs mt-1">I risultati appariranno non appena aggiornerai il file JSON.</p>
                    </div>`;
            } else {
                containerPartite.innerHTML = risultati.map((m, idx) => {
                    const nomeCasa = databaseSquadre[m.home]?.nome || m.home;
                    const nomeFuori = databaseSquadre[m.away]?.nome || m.away;
                    
                    const giocata = (m.gol_home !== null && m.gol_home !== undefined);
                    const vinceCasa  = giocata && m.gol_home > m.gol_away;
                    const vinceFuori = giocata && m.gol_home < m.gol_away;
                    const etBadge = m.extra_time === 1
                        ? '<span class="text-[10px] font-semibold bg-amber-100 text-amber-700 border border-amber-300 px-1.5 rounded mt-1 whitespace-nowrap">d.t.s.</span>'
                        : m.extra_time === 2
                        ? '<span class="text-[10px] font-semibold bg-orange-100 text-orange-700 border border-orange-300 px-1.5 rounded mt-1 whitespace-nowrap">rigori</span>'
                        : '';
                    const pillolaRisultato = giocata
                        ? `<div class="flex flex-col items-center gap-0.5">
                             <span class="bg-blue-900 text-white font-mono text-sm px-3 py-1 rounded-md font-bold shadow-xs whitespace-nowrap">${m.gol_home} - ${m.gol_away}</span>
                             ${etBadge}
                           </div>`
                        : `<span class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded font-medium whitespace-nowrap">Da giocare</span>`;

                    return `
                        <div class="bg-gray-50 px-4 py-3 rounded-xl border border-gray-100">
                            <div class="text-[10px] text-gray-400 mb-1.5 flex items-center gap-2">
                                <span class="font-mono text-gray-500">Match #${idx + 1}</span>
                                ${m.date ? `<span>(${m.date})</span>` : ''}
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-sm w-2/5 text-left truncate ${vinceCasa ? 'font-extrabold text-gray-900' : 'font-semibold text-gray-800'}">${getFlag(m.home)} ${nomeCasa}</span>
                                <div class="w-1/5 text-center flex justify-center">${pillolaRisultato}</div>
                                <span class="text-sm w-2/5 text-right truncate ${vinceFuori ? 'font-extrabold text-gray-900' : 'font-semibold text-gray-800'}">${nomeFuori} ${getFlag(m.away)}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // INTERFACCIA 4: GRAFICO STATISTICHE
            renderStatistiche();

            // INTERFACCIA 3: COSTRUZIONE LISTA SQUADRE REPLICA
            const grigliaSquadre = document.getElementById('griglia-squadre');
            const squadreOrdinate = Object.entries(databaseSquadre)
                .map(([cod, s]) => ({ cod, ...s }))
                .sort((a,b) => a.fascia - b.fascia || a.ranking - b.ranking);
            grigliaSquadre.innerHTML = squadreOrdinate.map(s => `
                <div class="flex justify-between items-center px-3 py-2.5 rounded-xl border text-xs ${s.fascia === 1 ? 'border-blue-100 bg-blue-50/20' : 'border-emerald-100 bg-emerald-50/20'}">
                    <div>
                        <p class="font-bold text-gray-900 text-sm">${getFlag(s.cod)} ${s.nome}</p>
                        <p class="text-gray-400 text-[11px] mt-0.5">Ranking FIFA: #${s.ranking} | Fascia ${s.fascia}ª</p>
                    </div>
                    <div class="flex gap-1 text-right">
                        <span class="font-mono bg-amber-50 border border-amber-200 px-2 py-1 rounded-md font-extrabold text-amber-700 text-xs shadow-2xs">V ${s.mult_v.toFixed(2)}</span>
                        <span class="font-mono bg-sky-50 border border-sky-200 px-2 py-1 rounded-md font-extrabold text-sky-700 text-xs shadow-2xs">P ${s.mult_p.toFixed(2)}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderStatistiche() {
            const container = document.getElementById('grafico-squadre');
            if (!container) return;

            const squadre = Object.entries(databaseSquadre)
                .map(([cod, s]) => ({ cod, nome: s.nome, punti: s.puntiReali || 0, fascia: s.fascia }))
                .sort((a, b) => b.punti - a.punti);

            const maxPunti = Math.max(...squadre.map(s => s.punti), 0.1);

            container.innerHTML = squadre.map(s => {
                const pct = (s.punti / maxPunti * 100).toFixed(1);
                const hasPoints = s.punti > 0;
                const barClass = !hasPoints ? 'bg-gray-200' : s.fascia === 1 ? 'bg-blue-500' : 'bg-emerald-500';
                const valClass = !hasPoints ? 'text-gray-400' : s.fascia === 1 ? 'text-blue-700 font-bold' : 'text-emerald-700 font-bold';
                return `
                    <div class="flex items-center gap-2 text-xs group cursor-default">
                        <div class="w-16 shrink-0 text-right leading-tight relative">
                            ${getFlag(s.cod)} <span class="font-mono font-semibold text-gray-700">${s.cod}</span>
                            <span class="absolute left-full ml-2 top-1/2 -translate-y-1/2 bg-gray-800 text-white text-xs rounded px-2 py-1 whitespace-nowrap opacity-0 group-hover:opacity-100 pointer-events-none z-10 transition-opacity duration-150">${s.nome}</span>
                        </div>
                        <div class="flex-1 bg-gray-100 rounded h-5 overflow-hidden">
                            <div class="${barClass} h-5" style="width:${pct}%"></div>
                        </div>
                        <div class="w-10 text-right font-mono shrink-0 ${valClass}">
                            ${hasPoints ? s.punti.toFixed(2) : '—'}
                        </div>
                    </div>`;
            }).join('');
        }

        async function caricaTicker() {
            const rss = 'https://news.google.com/rss/search?q=mondiali+2026+fifa&hl=it&gl=IT&ceid=IT:it';
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rss)}`);
                const data = await res.json();
                if (data.status !== 'ok' || !data.items?.length) return;

                const sep = '<span class="mx-8 text-blue-700">⚽</span>';
                const html = data.items.map(item =>
                    `<a href="${item.link}" target="_blank" rel="noopener noreferrer"
                        class="text-blue-200 hover:text-white transition-colors duration-150">${item.title}</a>`
                ).join(sep);

                const track = document.getElementById('ticker-track');
                track.innerHTML = html + sep + html; // duplicato per loop seamless
                track.style.animationDuration = `${data.items.length * 6}s`;
                document.getElementById('news-ticker').classList.remove('hidden');
            } catch (e) { /* ticker non mostrato se offline o errore */ }
        }

        // Listener che attiva l'applicazione all'avvio del DOM
        document.addEventListener('DOMContentLoaded', () => { caricaEElabora(); caricaTicker(); });
    </script>
</body>
</html>
